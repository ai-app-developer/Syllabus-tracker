name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK 36.1
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          sudo chown -R "$(id -u):$(id -g)" "$ANDROID_HOME"

          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "platforms;android-36.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          gradle --version
          set +e
          gradle assembleDebug --no-daemon --max-workers=2 --console=plain \
            -Dorg.gradle.configuration-cache=false \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            2>&1 | tee gradle-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "=== FAILURE SUMMARY ==="
            grep -n -C 8 -E "FAILED|FAILURE:|What went wrong:|Caused by:|OutOfMemoryError" gradle-build.log | tail -n 80 || true
            exit "$BUILD_STATUS"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SyllabusTracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
