name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK 36.1
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          sudo chown -R "$(id -u):$(id -g)" "$ANDROID_HOME"

          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "platforms;android-36.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Collect environment info
        shell: bash
        run: |
          mkdir -p logs
          {
            echo "=== Build Environment ==="
            date -u
            java -version 2>&1
            gradle --version
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls -la "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
            ls -la debug.keystore .env.example gradle.properties app/build.gradle.kts || true
          } | tee logs/env-info.txt

      - name: Build release APK
        id: build_apk
        shell: bash
        run: |
          mkdir -p logs
          chmod +x ./gradlew
          set +e
          ./gradlew assembleRelease \
            --no-daemon \
            --no-build-cache \
            --max-workers=2 \
            --console=plain \
            --stacktrace \
            -Dorg.gradle.configuration-cache=false \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            2>&1 | tee logs/gradle-build.log
          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then
            {
              echo "=== FAILED TASK & ROOT CAUSE ==="
              awk '
                /^> Task .* FAILED$/ { show=1 }
                /^FAILURE: Build failed with an exception\./ { show=1 }
                /^\* Try:$/ { show=0 }
                show { print }
              ' logs/gradle-build.log

              echo ""
              echo "=== ROOT CAUSES ==="
              awk '
                /^\* Exception is:$/ { in_ex=1; head=0; print; next }
                in_ex && head < 15 { print; head++; next }
                in_ex && /^Caused by:/ { caused=6 }
                in_ex && caused > 0 { print; caused-- }
              ' logs/gradle-build.log
            } | tee logs/failure-summary.txt

            {
              echo "## Build Failed (exit code $BUILD_STATUS)"
              echo '```text'
              cat logs/failure-summary.txt
              echo '```'
              echo "<details><summary>Full Gradle Build Log</summary>"
              echo ""
              echo '```text'
              tail -n 200 logs/gradle-build.log
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"

            echo ""
            echo "=========================================="
            echo "BUILD ERROR LOG (READ THIS):"
            echo "=========================================="
            cat logs/failure-summary.txt
            exit "$BUILD_STATUS"
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SyllabusTracker-build-logs
          path: logs/
          retention-days: 14

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SyllabusTracker-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
